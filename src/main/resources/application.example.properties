# Copy this file to application.properties and adjust values for your environment.
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/mall_sys?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=请填写MySQL密码
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
mybatis-plus.type-aliases-package=com.gec.domain.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Use an absolute path or a project-relative path on your machine.
web.uploadDir=./upload

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=3000

# Optional second-stage Hadoop/Hive configuration.
stage2.hive.url=jdbc:hive2://127.0.0.1:10000/default
stage2.hive.username=root
stage2.hive.password=
stage2.hive.driver-jar=请填写本机Hive JDBC驱动路径
stage2.hdfs.web-url=http://127.0.0.1:9870
stage2.source.behavior-file=
stage2.source.review-file=

